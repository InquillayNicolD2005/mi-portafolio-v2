<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#071125" />
		<title>Proyecto | Portafolio de Daniela Nicol</title>
		<link rel="stylesheet" href="assets/css/main.css" />
		<link rel="stylesheet" href="assets/css/portfolio.css" />
		<link rel="stylesheet" href="assets/css/project.css" />
	</head>
	<body class="project-page">
		<main class="project-page__main">
			<div class="project-container">
				<header class="project-intro">
					<p class="project-intro__eyebrow">Portafolio · Proyecto</p>
					<h1 id="project-title">Proyecto</h1>
					<p id="project-description">Comparte tu opinión o una pregunta sobre este proyecto.</p>
				</header>

				<div class="project-demo" id="project-demo" hidden></div>

				<section class="project-panel" aria-labelledby="project-form-title">
					<div class="project-panel__heading">
						<h2 id="project-form-title">Deja tu comentario</h2>
						<p>Los campos marcados son obligatorios.</p>
					</div>

					<form id="project-form" class="project-form" novalidate>
						<input type="hidden" name="project" id="project-input" value="" />

						<div class="project-form__fields">
							<div class="project-field">
								<label for="project-name">Nombre <span aria-hidden="true">*</span></label>
								<input type="text" name="name" id="project-name" placeholder="Tu nombre" autocomplete="name" minlength="2" required />
							</div>
							<div class="project-field">
								<label for="project-email">Correo electrónico <span aria-hidden="true">*</span></label>
								<input type="email" name="email" id="project-email" placeholder="tu@correo.com" autocomplete="email" required />
							</div>
							<div class="project-field project-field--wide">
								<label for="project-comment">Comentario <span aria-hidden="true">*</span></label>
								<textarea name="comment" id="project-comment" placeholder="Escribe tu comentario o pregunta" rows="4" minlength="3" maxlength="500" required></textarea>
							</div>
						</div>

						<div class="project-actions">
							<button type="submit" class="button primary" id="send-btn">Enviar comentario</button>
							<a href="index.html" class="button project-back">Volver a proyectos</a>
						</div>
						<p class="project-status" id="project-status" role="status" aria-live="polite" aria-atomic="true"></p>
					</form>
				</section>
			</div>
		</main>

		<script src="assets/js/project-demos.js"></script>
		<script src="assets/js/project.js"></script>
	</body>
</html>
